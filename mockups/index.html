<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tables — design mockup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Palette lifted from ../chat/src/theme.rs so the mockup reads like the GPUI app will. */
:root {
  color-scheme: dark;
  --bg:#24272d; --chrome:#2b2e35; --panel:#2f333a; --border:#3a3e47; --row:#31353c;
  --text:#dcdfe4; --muted:#959ba6; --quiet:#6c727d; --code:#abb2bf;
  --blue:#74ade8; --green:#98c379; --amber:#e5c07b; --orange:#d19a66; --red:#e06c75; --purple:#c678dd; --cyan:#56b6c2;
  --hover:#33373f; --selected:#2f3d52; --popover:#2e3138; --popover-hover:#3b3f48; --popover-border:#434852;
  --blue-tint:#2a3647; --green-tint:#2c3a2e; --amber-tint:#3b3427; --red-tint:#3e2b2f;
  --primary-text:#1e2127; --scrim:rgba(0,0,0,.36); --stripe: rgba(255,255,255,.012);
  --env: var(--red); --env-tint: var(--red-tint);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --mono: Menlo, ui-monospace, SFMono-Regular, monospace;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg:#fcfcfc; --chrome:#f3f3f4; --panel:#f6f6f7; --border:#e0e0e3; --row:#ededef;
  --text:#2c2d31; --muted:#76787f; --quiet:#a2a4aa; --code:#383a42;
  --blue:#2f6fde; --green:#3b7d3e; --amber:#a86a00; --orange:#c0601a; --red:#c2414b; --purple:#8a3fc7; --cyan:#1f8a99;
  --hover:#ebebed; --selected:#e2e8f1; --popover:#f5f5f6; --popover-hover:#e5e5e8; --popover-border:#d8d8dc;
  --blue-tint:#e7effc; --green-tint:#e8f3e9; --amber-tint:#fbf3e3; --red-tint:#fbe9ea;
  --primary-text:#fff; --scrim:rgba(0,0,0,.12); --stripe: rgba(0,0,0,.014);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #15171a; }
:root[data-theme="light"] body { background: #d9dadd; }
body { font: 13px/1.4 var(--ui); color: var(--text); padding: 18px; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
input, textarea, select { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 14px; height: 14px; flex: none; display: block; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s12 { width: 12px; height: 12px; } svg.i.s16 { width: 16px; height: 16px; }
kbd { font: 11px var(--ui); color: var(--quiet); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; line-height: 15px; display: inline-block; min-width: 17px; text-align: center; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: color-mix(in oklab, var(--quiet) 45%, transparent); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--quiet); }

/* ── window ─────────────────────────────────────────────── */
.window { height: 100%; min-width: 1100px; max-width: 1680px; margin: 0 auto; background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45); display: grid; grid-template-rows: 40px 1fr 24px; }
:root[data-theme="light"] .window { box-shadow: 0 30px 80px rgba(0,0,0,.18); }

.titlebar { position: relative; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px; background: var(--chrome); border-bottom: 1px solid var(--border); user-select: none; }
.titlebar::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--env); }
.lights { display: flex; gap: 8px; margin-right: 6px; } .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tbtn { height: 26px; min-width: 26px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: none; border-radius: 6px; color: var(--muted); cursor: default; }
.tbtn:hover { background: var(--hover); color: var(--text); } .tbtn.on { color: var(--text); }
.conn { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 6px; border-radius: 7px; cursor: default; }
.conn:hover { background: var(--hover); }
.conn .eng { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font: 700 10px var(--ui); color: #fff; background: #336791; letter-spacing: -.02em; }
.conn .nm { font-weight: 600; }
.conn .env { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--env); background: var(--env-tint); padding: 1px 6px; border-radius: 4px; }
.crumb { display: flex; align-items: center; gap: 4px; color: var(--muted); }
.crumb .sep { color: var(--quiet); }
.crumb span.c { padding: 2px 6px; border-radius: 5px; } .crumb span.c:hover { background: var(--hover); color: var(--text); }
.omni { flex: 0 1 380px; margin: 0 auto; height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); color: var(--quiet); cursor: text; }
.omni:hover { border-color: var(--popover-border); } .omni span { flex: 1; }
.tb-right { display: flex; align-items: center; gap: 2px; }

.body { display: grid; grid-template-columns: var(--sbw, 252px) minmax(0,1fr) var(--dpw, 330px); min-height: 0; transition: grid-template-columns .18s ease; }
.body.no-sb { --sbw: 0px; } .body.no-dp { --dpw: 0px; }
.body.no-sb .sidebar, .body.no-dp .detail { visibility: hidden; }

/* ── sidebar ────────────────────────────────────────────── */
.sidebar { background: var(--chrome); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.sb-top { padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 8px; }
.sb-db { display: flex; gap: 6px; }
.sel { height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); cursor: default; white-space: nowrap; }
.sel:hover { border-color: var(--popover-border); } .sel .lbl { color: var(--quiet); font-size: 11px; } .sel .v { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.sel svg { color: var(--quiet); }
.search { height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); color: var(--quiet); }
.search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in oklab, var(--blue) 22%, transparent); }
.search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; color: var(--text); }
.search input::placeholder { color: var(--quiet); }
.sb-scroll { flex: 1; overflow: auto; padding: 2px 6px 10px; }
.sec { margin-top: 6px; }
.sec-h { display: flex; align-items: center; gap: 4px; padding: 5px 6px; font-size: 11px; font-weight: 600; color: var(--quiet); letter-spacing: .04em; text-transform: uppercase; cursor: default; user-select: none; }
.sec-h .chev { transition: transform .12s; } .sec.closed .chev { transform: rotate(-90deg); } .sec.closed .items { display: none; }
.sec-h .n { margin-left: auto; font-weight: 500; letter-spacing: 0; }
.item { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px; border-radius: 6px; color: var(--text); cursor: default; user-select: none; white-space: nowrap; }
.item svg { color: var(--quiet); } .item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.item .cnt { font-size: 11px; color: var(--quiet); font-variant-numeric: tabular-nums; }
.item:hover { background: var(--hover); }
.item.open .nm { font-weight: 500; }
.item.active { background: var(--selected); } .item.active svg { color: var(--blue); }
.item mark { background: none; color: var(--blue); font-weight: 600; }
.item.pin svg.pinned { color: var(--amber); }
.sb-foot { border-top: 1px solid var(--border); padding: 8px 10px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.sb-foot .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px color-mix(in oklab, var(--green) 20%, transparent); }
.sb-foot .sp { flex: 1; }

/* ── main ───────────────────────────────────────────────── */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabs { height: 36px; display: flex; align-items: stretch; background: var(--chrome); border-bottom: 1px solid var(--border); flex: none; }
.tabs-scroll { display: flex; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; } .tabs-scroll::-webkit-scrollbar { display: none; }
.tab { position: relative; display: flex; align-items: center; gap: 7px; padding: 0 8px 0 12px; min-width: 120px; max-width: 220px; border-right: 1px solid var(--border); color: var(--muted); cursor: default; user-select: none; white-space: nowrap; }
.tab .t { flex: 1; overflow: hidden; text-overflow: ellipsis; } .tab .t small { color: var(--quiet); margin-left: 4px; }
.tab.preview .t { font-style: italic; }
.tab:hover { background: color-mix(in oklab, var(--hover) 60%, var(--chrome)); }
.tab.active { background: var(--bg); color: var(--text); }
.tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--bg); }
.tab.active::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--blue); }
.tab .x { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; color: var(--quiet); border: 0; background: none; opacity: 0; }
.tab:hover .x, .tab.active .x { opacity: 1; } .tab .x:hover { background: var(--hover); color: var(--text); }
.tab .dirty { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin: 0 5px; }
.tab:hover .dirty { display: none; } .tab:not(:hover) .dirty + .x { display: none; }
.tab .ti-table { color: var(--blue); } .tab .ti-sql { color: var(--amber); } .tab .ti-view { color: var(--purple); }
.tabs .add { width: 36px; display: grid; place-items: center; color: var(--quiet); border: 0; background: none; }
.tabs .add:hover { color: var(--text); background: var(--hover); }
.tabs .fill { flex: 1; }

.toolbar { height: 40px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--border); }
.btn { height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: default; white-space: nowrap; }
.btn:hover { background: var(--hover); } .btn svg { color: var(--muted); }
.btn.ghost { border-color: transparent; background: none; } .btn.ghost:hover { background: var(--hover); }
.btn.on { background: var(--blue-tint); border-color: color-mix(in oklab, var(--blue) 45%, var(--border)); color: var(--blue); } .btn.on svg { color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--primary-text); font-weight: 500; } .btn.primary svg { color: var(--primary-text); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { background: var(--red); border-color: var(--red); color: var(--primary-text); font-weight: 500; }
.btn .badge { font-size: 10px; font-weight: 700; background: var(--blue); color: var(--primary-text); border-radius: 8px; padding: 0 5px; line-height: 15px; }
.btn kbd { margin-left: 2px; border-color: color-mix(in oklab, currentColor 30%, transparent); color: inherit; opacity: .75; }
.vsep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
.sp { flex: 1; }
.tag { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; color: var(--purple); background: color-mix(in oklab, var(--purple) 16%, transparent); }
.title-chip { display: flex; align-items: baseline; gap: 6px; font-weight: 600; margin-right: 6px; } .title-chip small { font-weight: 400; color: var(--quiet); }

/* filters */
.filters { flex: none; border-bottom: 1px solid var(--border); padding: 6px 10px; display: flex; flex-direction: column; gap: 6px; background: var(--panel); }
.frow { display: flex; align-items: center; gap: 6px; }
.frow .conj { width: 44px; font-size: 11px; color: var(--quiet); text-align: right; padding-right: 4px; }
.fin { height: 26px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); padding: 0 8px; outline: 0; }
.fin:focus { border-color: var(--blue); }
select.fin { appearance: none; padding-right: 22px; background-image: linear-gradient(45deg, transparent 50%, var(--quiet) 50%), linear-gradient(135deg, var(--quiet) 50%, transparent 50%); background-position: calc(100% - 12px) 11px, calc(100% - 8px) 11px; background-size: 4px 4px; background-repeat: no-repeat; }
.fin.val { width: 240px; font-family: var(--mono); font-size: 12px; }
.frow .rm { color: var(--quiet); }

/* ── grid ───────────────────────────────────────────────── */
.grid-area { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.grid-wrap { flex: 1; overflow: auto; min-height: 0; position: relative; outline: none; }
table.grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 12.5px; }
.grid th, .grid td { height: 27px; padding: 0 9px; border-right: 1px solid var(--row); border-bottom: 1px solid var(--row); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.grid thead th { position: sticky; top: 0; z-index: 2; background: var(--chrome); font-weight: 500; height: 30px; border-bottom-color: var(--border); user-select: none; cursor: default; padding-right: 4px; }
.grid thead th:hover { background: color-mix(in oklab, var(--hover) 70%, var(--chrome)); }
.th { display: flex; align-items: center; gap: 5px; min-width: 0; }
.th .cn { overflow: hidden; text-overflow: ellipsis; }
.th .ct { color: var(--quiet); font-weight: 400; font-size: 11px; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.th .k { color: var(--amber); } .th .l { color: var(--cyan); }
.th .so { color: var(--blue); }
.rz { position: absolute; right: -3px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 3; }
.rz:hover, .rz.drag { background: linear-gradient(var(--blue),var(--blue)) center/2px 100% no-repeat; }
.grid .rn { position: sticky; left: 0; z-index: 1; background: var(--chrome); color: var(--quiet); text-align: right; font-size: 11px; padding: 0 8px 0 4px; font-variant-numeric: tabular-nums; user-select: none; }
.grid thead .rn { z-index: 3; }
.grid tbody tr:nth-child(even) td:not(.rn) { background: var(--stripe); }
.grid tbody tr:hover td:not(.rn) { background: color-mix(in oklab, var(--hover) 55%, transparent); }
.grid tbody tr.rsel td:not(.rn) { background: var(--selected); }
.grid tbody tr.rsel td.rn { color: var(--blue); background: color-mix(in oklab, var(--selected) 70%, var(--chrome)); box-shadow: inset 2px 0 var(--blue); }
.grid td.cur { box-shadow: inset 0 0 0 1.5px var(--blue); }
.grid td.ed { background: var(--amber-tint) !important; position: relative; }
.grid td.ed::after { content: ""; position: absolute; top: 0; right: 0; border: 4px solid transparent; border-top-color: var(--amber); border-right-color: var(--amber); }
.grid tr.ins td:not(.rn) { background: var(--green-tint) !important; }
.grid tr.ins td.rn { color: var(--green); box-shadow: inset 2px 0 var(--green); }
.grid tr.del td:not(.rn) { background: var(--red-tint) !important; color: var(--quiet); text-decoration: line-through; text-decoration-color: color-mix(in oklab, var(--red) 60%, transparent); }
.grid tr.del td.rn { color: var(--red); box-shadow: inset 2px 0 var(--red); }
.grid td.r { text-align: right; font-variant-numeric: tabular-nums; }
.grid td.cur.editing { padding: 0; box-shadow: inset 0 0 0 2px var(--blue); overflow: visible; }
.grid td input.cell-in { width: 100%; height: 100%; border: 0; outline: 0; background: var(--bg); padding: 0 8px; font: inherit; }
.v-null { color: var(--quiet); font-style: italic; font-size: 11px; letter-spacing: .02em; }
.v-def { color: var(--quiet); font-style: italic; font-size: 11px; }
.v-ts { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.v-json { color: var(--code); font-family: var(--mono); font-size: 11.5px; }
.v-json .p { color: var(--quiet); }
.v-bool { font-family: var(--mono); font-size: 11.5px; } .v-bool.t { color: var(--green); } .v-bool.f { color: var(--quiet); }
.v-num { font-family: var(--mono); font-size: 11.5px; }
.v-enum { display: inline-flex; align-items: center; gap: 6px; } .v-enum i { width: 6px; height: 6px; border-radius: 50%; display: block; flex: none; }
.v-fk { display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
.v-fk .go { opacity: 0; color: var(--cyan); border: 0; background: none; padding: 0; display: grid; }
.grid td:hover .v-fk .go, .grid tr.rsel .v-fk .go { opacity: 1; }
.v-arr { display: inline-flex; gap: 3px; } .v-arr b { font-weight: 400; font-size: 11px; padding: 0 5px; border-radius: 3px; background: var(--hover); color: var(--muted); }
.v-uuid { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.hit { background: color-mix(in oklab, var(--amber) 35%, transparent); color: var(--text); border-radius: 2px; }

.foot { height: 32px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-top: 1px solid var(--border); background: var(--chrome); color: var(--muted); font-size: 12px; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; height: 22px; }
.seg button { border: 0; background: none; padding: 0 10px; color: var(--muted); font-size: 12px; cursor: default; display: flex; align-items: center; gap: 5px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--selected); color: var(--text); }
.pager { display: flex; align-items: center; gap: 2px; } .pager .tbtn { height: 22px; min-width: 22px; }

/* pending changes pill */
.changes { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 5px 5px 5px 12px; border-radius: 10px;
  background: var(--popover); border: 1px solid var(--popover-border); box-shadow: 0 10px 30px rgba(0,0,0,.35); z-index: 5; white-space: nowrap; animation: rise .2s ease; }
.changes .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
.changes .lg { display: flex; gap: 8px; color: var(--muted); font-size: 12px; margin: 0 6px 0 2px; }
.changes .lg b { font-weight: 500; } .lg .e { color: var(--amber); } .lg .a { color: var(--green); } .lg .d { color: var(--red); }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }

/* ── structure ──────────────────────────────────────────── */
.struct { flex: 1; overflow: auto; padding: 18px 22px 40px; }
.struct h3 { font-size: 12px; font-weight: 600; margin: 22px 0 8px; display: flex; align-items: center; gap: 8px; }
.struct h3:first-child { margin-top: 0; } .struct h3 small { font-weight: 400; color: var(--quiet); }
table.st { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.st th { text-align: left; font-weight: 500; font-size: 11px; color: var(--quiet); padding: 0 10px 6px; border-bottom: 1px solid var(--border); }
.st td { padding: 6px 10px; border-bottom: 1px solid var(--row); vertical-align: middle; }
.st tr:hover td { background: var(--hover); }
.st .nm { font-weight: 500; } .st .ty { font-family: var(--mono); font-size: 11.5px; color: var(--purple); } .st .df { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
.chip.pk { color: var(--amber); background: var(--amber-tint); } .chip.fk { color: var(--cyan); background: color-mix(in oklab, var(--cyan) 15%, transparent); }
.chip.uq { color: var(--purple); background: color-mix(in oklab, var(--purple) 14%, transparent); } .chip.nn { color: var(--muted); background: var(--hover); }
pre.code { margin: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); font: 12px/1.6 var(--mono); color: var(--code); overflow: auto; }

/* ── sql ────────────────────────────────────────────────── */
.sql { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.editor { height: var(--edh, 42%); min-height: 90px; flex: none; position: relative; background: var(--bg); }
.ed-scroll { position: absolute; inset: 0; overflow: auto; display: flex; }
.gutter { position: sticky; left: 0; z-index: 2; flex: none; width: 46px; padding: 12px 10px 12px 0; text-align: right; color: var(--quiet); background: var(--bg); font: 12.5px/20px var(--mono); user-select: none; min-height: 100%; }
.gutter div.on { color: var(--text); }
.code-wrap { position: relative; flex: 1; min-width: max-content; }
.code-wrap pre, .code-wrap textarea { margin: 0; padding: 12px 16px 40px 8px; font: 12.5px/20px var(--mono); white-space: pre; tab-size: 2; letter-spacing: 0; border: 0; }
.code-wrap pre { color: var(--code); pointer-events: none; position: relative; z-index: 1; min-height: 100%; }
.code-wrap textarea { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; overflow: hidden; background: transparent; color: transparent; caret-color: var(--blue); outline: none; z-index: 2; }
.code-wrap textarea::selection { background: color-mix(in oklab, var(--blue) 30%, transparent); color: transparent; }
.curline { position: absolute; left: 0; right: 0; height: 20px; background: color-mix(in oklab, var(--hover) 55%, transparent); z-index: 0; pointer-events: none; }

function genRows(name) {
  const s = SCHEMA[name];
  rng = mulberry32([...name].reduce((a,c)=>a*31+c.charCodeAt(0)|0, 7));
  const n = Math.min(TOTAL_SHOWN, s.rows);
  return Array.from({length:n}, (_, i) => {
    const x = { i, n, p: { f: pick(FIRST), l: pick(LAST) }, co: COMPANIES[i % COMPANIES.length] + (i >= COMPANIES.length ? ' ' + pick(['GmbH','Ltd','Inc','& Co','Group']) : '') };
    return { k: i, v: s.cols.map(c => c.g(x)) };
  });
}

function hiName(name, q) {
  if (!q) return esc(name);
  const i = name.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(name);
  return esc(name.slice(0,i)) + '<mark>' + esc(name.slice(i, i+q.length)) + '</mark>' + esc(name.slice(i+q.length));
}

  else if (/^(int|numeric|float|real|double)/.test(t)) { h = `<span class="v-num">${esc(v)}</span>`; cls = 'r'; }
  else if (t.startsWith('timestamp') || t === 'date') h = `<span class="v-ts">${esc(v)}</span>`;
  else if (t.startsWith('json')) h = `<span class="v-json">${hilite(jsonInline(v), q)}</span>`;
  else if (t.endsWith('[]')) h = `<span class="v-arr">${v.map(x=>`<b>${esc(x)}</b>`).join('')}</span>`;
  else if (t === 'uuid' || t === 'inet') h = `<span class="v-uuid">${hilite(esc(v), q)}</span>`;
  else if (c.enum || ENUM_COLOR[v]) h = `<span class="v-enum"><i style="background:var(--${ENUM_COLOR[v]||'quiet'})"></i>${hilite(esc(v), q)}</span>`;

function hilite(html, q) {

const valueText = v => v === null ? 'NULL' : v === DEFAULT ? 'DEFAULT' : typeof v === 'object' ? JSON.stringify(v) : String(v);

/* ════════════════════════════════════════════════════════════
   table view
   ════════════════════════════════════════════════════════════ */
const activeTab = () => S.tabs.find(t => t.id === S.active);
const cellVal = (t, row, ci) => { const k = row.k + ':' + ci; return t.changes.has(k) ? t.changes.get(k) : row.v[ci]; };
const pendingCount = t => t.kind === 'table' ? new Set([...t.changes.keys()].map(k => k.split(':')[0]).filter(rk => !t.rows.find(r => String(r.k)===rk)?.ins)).size + t.deleted.size + t.rows.filter(r=>r.ins).length : 0;

function displayed(t) {
  const cols = SCHEMA[t.table].cols;
  let rows = t.rows.slice();
  for (const f of t.filters) {
    const ci = cols.findIndex(c => c.n === f.col); if (ci < 0) continue;
    rows = rows.filter(r => {
      if (r.ins) return true;
      const v = cellVal(t, r, ci), s = valueText(v).toLowerCase(), q = f.val.toLowerCase();
      switch (f.op) {
        case '=': return s === q; case '!=': return s !== q;
        case 'contains': return s.includes(q); case 'starts with': return s.startsWith(q);
        case '>': return parseFloat(s) > parseFloat(q) || (isNaN(parseFloat(q)) && s > q);
        case '<': return parseFloat(s) < parseFloat(q) || (isNaN(parseFloat(q)) && s < q);
        case 'is null': return v === null; case 'is not null': return v !== null;
      }
      return true;
    });
  }
  if (t.quick) { const q = t.quick.toLowerCase(); rows = rows.filter(r => r.ins || r.v.some((_, ci) => valueText(cellVal(t, r, ci)).toLowerCase().includes(q))); }
  if (t.sort) {
    const { c, dir } = t.sort;
    rows.sort((a, b) => {
      if (a.ins !== b.ins) return a.ins ? -1 : 1;
      const x = cellVal(t, a, c), y = cellVal(t, b, c);
      if (x === null) return 1; if (y === null) return -1;
      const nx = parseFloat(x), ny = parseFloat(y);
      const r = !isNaN(nx) && !isNaN(ny) && typeof x !== 'object' ? nx - ny : valueText(x).localeCompare(valueText(y));
      return dir === 'asc' ? r : -r;
    });
  }

}
function defaultWidths(cols, rows) {
  return cols.map((c, ci) => {
    const t = c.t;
    if (c.pk && /^int/.test(t)) return 86;
    if (t === 'bool') return 96;
    if (c.fk) return 112;
    if (t === 'uuid') return 300;
    if (t.startsWith('timestamp')) return 172;
    if (t.startsWith('json')) return 300;
    if (/^(int|numeric)/.test(t)) return 116;
    const longest = Math.max(c.n.length + c.t.length * .8, ...rows.slice(0, 30).map(r => valueText(r.v[ci]).length));
    return Math.max(96, Math.min(300, longest * 7.4 + 24));
  });
}

function renderTableView(t) {

    <div class="toolbar">

      <button class="btn ${t.showFilters||nFilters?'on':''}" data-act="filters">${ic('filter')}Filter${nFilters?`<span class="badge">${nFilters}</span>`:''}</button>

function renderFilters(t) {
  const cols = SCHEMA[t.table].cols;
  const list = t.filters.length ? t.filters : [{ col: cols[1].n, op: '=', val: '', draft: true }];
  const ops = ['=','!=','contains','starts with','>','<','is null','is not null'];
  return `<div class="filters" id="filters">${list.map((f, i) => `
    <div class="frow" data-fi="${i}">
      <span class="conj">${i === 0 ? 'WHERE' : 'AND'}</span>
      <select class="fin" data-f="col">${cols.map(c => `<option ${c.n===f.col?'selected':''}>${c.n}</option>`).join('')}</select>
      <select class="fin" data-f="op">${ops.map(o => `<option ${o===f.op?'selected':''}>${o}</option>`).join('')}</select>
      ${/null/.test(f.op) ? '' : `<input class="fin val" data-f="val" value="${esc(f.val)}" placeholder="value" spellcheck="false">`}

      ${i === list.length - 1 ? `<button class="btn ghost" data-act="addfilter">${ic('plus','s12')}Condition</button><span class="sp"></span>

    </div>`).join('')}</div>`;
}
function filterSQL(t) {

  return 'WHERE ' + fs.map(f => /null/.test(f.op) ? `${f.col} ${f.op.toUpperCase()}` : f.op === 'contains' ? `${f.col}::text ILIKE '%${f.val}%'` : f.op === 'starts with' ? `${f.col}::text ILIKE '${f.val}%'` : `${f.col} ${f.op} '${f.val}'`).join(' AND ');
}

function renderGrid(t) {

    <tbody>${rows.map((r, ri) => {

    }).join('')}</tbody></table>

  wrap.scrollTop = keepTop; wrap.scrollLeft = keepLeft;
  const info = $('#rowInfo');
  if (info) info.textContent = t.filters.length || t.quick ? `${rows.length} of ${TOTAL_SHOWN} loaded rows match` : `Rows 1–${Math.min(TOTAL_SHOWN, SCHEMA[t.table].rows)} of ${fmt(SCHEMA[t.table].rows)}`;

}

function renderChanges(t) {
  $('.changes')?.remove();
  const n = pendingCount(t); if (!n || t.mode !== 'data') return;
  const edits = new Set([...t.changes.keys()].map(k => k.split(':')[0]).filter(rk => !t.rows.find(r => String(r.k)===rk)?.ins)).size;

    <span class="lg">${edits?`<span class="e">~${edits} edited</span>`:''}${adds?`<span class="a">+${adds} new</span>`:''}${dels?`<span class="d">−${dels} deleted</span>`:''}</span>
    <button class="btn ghost" data-act="preview">${ic('sql')}Review SQL</button>

    <button class="btn primary" data-act="commit">Commit<kbd>⌘S</kbd></button>`;

function selectCell(t, r, c, scroll=true) {
  const rows = t._rows || [];
  r = Math.max(0, Math.min(rows.length - 1, r));
  c = Math.max(0, Math.min(SCHEMA[t.table].cols.length - 1, c));
  t.sel = { r, c };
  $$('#gridWrap tr.rsel').forEach(e => e.classList.remove('rsel'));
  $$('#gridWrap td.cur').forEach(e => e.classList.remove('cur'));
  const tr = $(`#gridWrap tbody tr[data-r="${r}"]`); if (!tr) return;
  tr.classList.add('rsel');
  const td = tr.querySelector(`td[data-c="${c}"]`); td.classList.add('cur');
  if (scroll) {
    const wrap = $('#gridWrap'), hdr = 30, rn = 46;
    if (tr.offsetTop - hdr < wrap.scrollTop) wrap.scrollTop = tr.offsetTop - hdr;
    else if (tr.offsetTop + tr.offsetHeight > wrap.scrollTop + wrap.clientHeight - 50) wrap.scrollTop = tr.offsetTop + tr.offsetHeight - wrap.clientHeight + 50;
    if (td.offsetLeft - rn < wrap.scrollLeft) wrap.scrollLeft = td.offsetLeft - rn;
    else if (td.offsetLeft + td.offsetWidth > wrap.scrollLeft + wrap.clientWidth) wrap.scrollLeft = td.offsetLeft + td.offsetWidth - wrap.clientWidth;
  }
  renderDetail();
}

function setValue(t, row, ci, v) {
  const orig = row.v[ci];
  const k = row.k + ':' + ci;
  if (!row.ins && valueText(orig) === valueText(v)) t.changes.delete(k); else t.changes.set(k, v);
}
function parseInput(str, c, old) {

  if (c.t.startsWith('json')) { try { return JSON.parse(str); } catch { return str; } }
  if (c.t.endsWith('[]')) return str.replace(/^\{|\}$/g,'').split(',').map(s=>s.trim()).filter(Boolean);

}
function editCell(t, startText) {

  const col = SCHEMA[t.table].cols[c];
  const td = $(`#gridWrap tr[data-r="${r}"] td[data-c="${c}"]`);
  const cur = cellVal(t, row, c);
  td.classList.add('editing');
  td.innerHTML = `<input class="cell-in ${/^(int|numeric)/.test(col.t)||col.fk?'mono':''}" spellcheck="false">`;
  const inp = td.firstChild;
  inp.value = startText ?? (cur === null || cur === DEFAULT ? '' : valueText(cur));
  if (cur === null) inp.placeholder = 'NULL';
  inp.focus(); if (startText == null) inp.select();
  let done = false;
  const finish = save => {
    if (done) return; done = true;
    if (save) setValue(t, row, c, parseInput(inp.value, col, cur));
    renderGrid(t); renderTabs(); renderDetail();
    $('#gridWrap').focus({ preventScroll: true });
  };

    if (e.key === 'Enter') { e.preventDefault(); finish(true); selectCell(t, t.sel.r + (e.shiftKey ? -1 : 1), t.sel.c); }
    else if (e.key === 'Tab') { e.preventDefault(); finish(true); selectCell(t, t.sel.r, t.sel.c + (e.shiftKey ? -1 : 1)); }

function renderStructure(name) {

    <h3>Indexes <small>${idx.length}</small></h3>
    <table class="st"><thead><tr><th>Name</th><th>Columns</th><th>Method</th><th>Unique</th><th style="text-align:right">Size</th><th style="text-align:right">Scans (7d)</th></tr></thead>

/* ════════════════════════════════════════════════════════════
   detail panel
   ════════════════════════════════════════════════════════════ */
function jsonPretty(v, ind = '') {
  const n = ind + '  ';
  if (v === null) return '<span class="j-b">null</span>';
  if (Array.isArray(v)) return v.length ? `<span class="j-p">[</span>\n${v.map(x => n + jsonPretty(x, n)).join('<span class="j-p">,</span>\n')}\n${ind}<span class="j-p">]</span>` : '<span class="j-p">[]</span>';
  if (typeof v === 'object') { const e = Object.entries(v); return e.length ? `<span class="j-p">{</span>\n${e.map(([k, x]) => `${n}<span class="j-k">"${esc(k)}"</span><span class="j-p">:</span> ${jsonPretty(x, n)}`).join('<span class="j-p">,</span>\n')}\n${ind}<span class="j-p">}</span>` : '<span class="j-p">{}</span>'; }
  if (typeof v === 'string') return `<span class="j-s">"${esc(v)}"</span>`;
  if (typeof v === 'number') return `<span class="j-n">${v}</span>`;
  return `<span class="j-b">${v}</span>`;
}
function renderDetail() {
  const el = $('#detail');
  const t = activeTab();
  if (!t) { el.innerHTML = ''; return; }
  let cols, row, getV, title, sub, editable, rowObj;
  if (t.kind === 'table') {
    const s = SCHEMA[t.table]; cols = s.cols;
    rowObj = (t._rows || [])[t.sel.r];
    if (!rowObj) { el.innerHTML = `<div class="dp-head"><span class="h">Row</span></div><div class="dp-empty">No row selected</div>`; return; }
    getV = ci => cellVal(t, rowObj, ci);
    const pk = cols.findIndex(c => c.pk);
    title = esc(t.table); sub = rowObj.ins ? 'new row' : `${cols[pk].n} ${esc(valueText(rowObj.v[pk])).slice(0, 13)}`;
    editable = !s.view && !t.deleted.has(rowObj.k);
  } else {
    const res = t.result;
    if (!res || !res.rows || !res.rows.length) { el.innerHTML = `<div class="dp-head"><span class="h">Row</span></div><div class="dp-empty"><div>Run a query and select a row<br>to inspect it here.</div></div>`; return; }
    cols = res.cols; const r = res.rows[t.sel.r] || res.rows[0];

const KW = new Set('select from where and or not in is null join left right inner outer full cross on as group by order having limit offset distinct union all insert into values update set delete returning with case when then else end asc desc between like ilike exists create table alter drop index primary key references default interval true false explain analyze over partition filter lateral coalesce cast'.split(' '));

function tokenize(src) {
  const re = /(--[^\n]*)|('(?:[^']|'')*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w]*)|(::|<>|!=|>=|<=|[=<>+\-*/%|])|([\s\S])/g;
  let out = '', m;
  while ((m = re.exec(src))) {
    const [s, com, str, num, word, op] = m;
    if (com) out += `<span class="tk-com">${esc(com)}</span>`;
    else if (str) out += `<span class="tk-str">${esc(str)}</span>`;
    else if (num) out += `<span class="tk-num">${num}</span>`;
    else if (word) {
      const lw = word.toLowerCase();
      if (FN.has(lw) && src[re.lastIndex] === '(') out += `<span class="tk-fn">${word}</span>`;
      else if (KW.has(lw)) out += `<span class="tk-kw">${word}</span>`;
      else if (SCHEMA[lw]) out += `<span class="tk-tbl">${word}</span>`;
      else if (TYPES.has(lw) && src.slice(re.lastIndex - word.length - 2, re.lastIndex - word.length) === '::') out += `<span class="tk-ty">${word}</span>`;
      else out += esc(word);
    }
    else if (op) out += `<span class="tk-op">${esc(op)}</span>`;

}

SELECT c.plan,

function fuzzy(q, s) {

  const sub = ls.indexOf(lq);
  if (sub >= 0) return { score: 100 - sub - s.length * .1, h: esc(s.slice(0, sub)) + '<b>' + esc(s.slice(sub, sub + q.length)) + '</b>' + esc(s.slice(sub + q.length)) };
  let i = 0, h = '', score = 0, last = -2;
  for (let j = 0; j < s.length; j++) { if (i < lq.length && ls[j] === lq[i]) { h += '<b>' + esc(s[j]) + '</b>'; score += j === last + 1 ? 3 : 1; last = j; i++; } else h += esc(s[j]); }
  return i === lq.length ? { score, h } : null;
}
function openPalette(initial = '') {

function changeSQL(t) {
  const s = SCHEMA[t.table], cols = s.cols, pkI = cols.findIndex(c => c.pk), pk = cols[pkI];
  const lit = (v, c) => v === null ? 'NULL' : v === DEFAULT ? 'DEFAULT' : typeof v === 'boolean' ? String(v).toUpperCase() : typeof v === 'object' ? `'${JSON.stringify(v).replace(/'/g, "''")}'${c.t.endsWith('[]') ? '' : '::jsonb'}` : /^(int|numeric)/.test(c.t) && !isNaN(+v) ? v : `'${String(v).replace(/'/g, "''")}'`;
  const out = [];
  const byRow = {};
  for (const [k, v] of t.changes) { const [rk, ci] = k.split(':').map(Number); (byRow[rk] ||= []).push([ci, v]); }
  for (const r of t.rows) {
    if (r.ins) { const ent = cols.map((c, ci) => [c, cellVal(t, r, ci)]).filter(([, v]) => v !== DEFAULT); out.push(`INSERT INTO public.${t.table} (${ent.map(([c]) => c.n).join(', ')})\nVALUES (${ent.map(([c, v]) => lit(v, c)).join(', ')});`); }
    else if (t.deleted.has(r.k)) out.push(`DELETE FROM public.${t.table} WHERE ${pk.n} = ${lit(r.v[pkI], pk)};`);
    else if (byRow[r.k]) out.push(`UPDATE public.${t.table}\nSET ${byRow[r.k].map(([ci, v]) => `${cols[ci].n} = ${lit(v, cols[ci])}`).join(',\n    ')}\nWHERE ${pk.n} = ${lit(r.v[pkI], pk)};`);

}

function commit(t) {
  const n = pendingCount(t);
  for (const [k, v] of t.changes) { const [rk, ci] = k.split(':').map(Number); const r = t.rows.find(r => r.k === rk); if (r) r.v[ci] = v; }
  t.rows = t.rows.filter(r => !t.deleted.has(r.k));

    if (a === 'clearfilters') { e.preventDefault(); t.filters = []; t.showFilters = false; t.quick = ''; renderTableView(t); renderDetail(); return; }
    if (a === 'addrow') return addRow(t);
    if (a === 'refresh') { t.ms = 20 + R(60); toast('Reloaded ' + t.table, 'refresh', t.ms + ' ms'); renderStatus(); return; }
    if (a === 'export') { const r = actEl.getBoundingClientRect(); menu(r.left - 150, r.bottom + 4, [{ h: 'Export ' + t.table }, { i: 'download', l: 'CSV', meta: '100 rows', fn: () => toast('Exported 100 rows as CSV', 'download') }, { i: 'download', l: 'JSON', fn: () => toast('Exported 100 rows as JSON', 'download') }, { i: 'sql', l: 'SQL INSERTs', fn: () => toast('Copied 100 INSERT statements', 'copy') }, '-', { i: 'download', l: 'Entire table…', meta: compact(SCHEMA[t.table].rows) + ' rows' }]); return; }
    if (a === 'cols') { const r = actEl.getBoundingClientRect(); menu(r.left, r.bottom + 4, [{ h: 'Visible columns' }, ...SCHEMA[t.table].cols.map(c => ({ i: 'check', l: c.n, meta: c.t }))]); return; }
    if (a === 'sortmenu') { const r = actEl.getBoundingClientRect(); menu(r.left, r.bottom + 4, [{ h: 'Sort by' }, ...SCHEMA[t.table].cols.map((c, ci) => ({ i: t.sort?.c === ci ? (t.sort.dir === 'asc' ? 'up' : 'down') : 'sort', l: c.n, fn: () => { t.sort = { c: ci, dir: t.sort?.c === ci && t.sort.dir === 'asc' ? 'desc' : 'asc' }; renderTableView(t); renderDetail(); } })), '-', { i: 'x', l: 'Clear sort', fn: () => { t.sort = null; renderTableView(t); renderDetail(); } }]); return; }
    if (a === 'preview') return reviewModal(t, false);
    if (a === 'commit') return S.conn.env === 'production' ? reviewModal(t, true) : commit(t);
    if (a === 'discard') return discard(t);
    if (a === 'copyddl') return toast('Copied CREATE TABLE ' + t.table);
    const th = e.target.closest('th[data-sortc]');
    if (th && !e.target.closest('.rz')) { const ci = +th.dataset.sortc; t.sort = t.sort?.c === ci ? (t.sort.dir === 'asc' ? { c: ci, dir: 'desc' } : null) : { c: ci, dir: 'asc' }; renderGrid(t); renderTableView(t); renderDetail(); return; }
    const td = e.target.closest('#gridWrap td[data-c]');
    if (td && !td.classList.contains('editing')) { selectCell(t, +td.parentElement.dataset.r, +td.dataset.c, false); }
    const rn = e.target.closest('#gridWrap td.rn'); if (rn) selectCell(t, +rn.parentElement.dataset.r, 0, false);
  } else {
    if (a === 'run') return doRun(t);
    if (a === 'runexplain') return doRun(t, true);
    if (a === 'format') { const ta = $('#ta'); ta.value = ta.value.replace(/("(?:[^"])*"|'(?:[^']|'')*'|--[^\n]*)|\b([A-Za-z_]+)\b/g, (m, q, w) => q ? q : KW.has(w.toLowerCase()) ? w.toUpperCase() : w); onEditorInput(); toast('Formatted', 'format'); return; }
    if (a === 'savesql') { t.dirty = false; renderTabs(); toast(`Saved “${t.title}”`, 'save'); return; }
    if (a === 'history') { const r = actEl.getBoundingClientRect(); menu(r.left - 240, r.bottom + 4, [{ h: 'Recent on ' + S.conn.name }, ...['SELECT * FROM users WHERE email ILIKE …','UPDATE orders SET status = \'shipped\' …','SELECT count(*) FROM events WHERE …','EXPLAIN ANALYZE SELECT … FROM orders'].map((q, i) => ({ i: 'history', l: `<span class="mono">${esc(q)}</span>`, meta: ['2m','18m','1h','yesterday'][i] }))]); return; }
    if (a === 'export') return toast(`Exported ${t.result?.rows?.length || 0} rows as CSV`, 'download');
    if (a === 'copyres') return toast('Copied result as TSV', 'copy');
    const td = e.target.closest('#resGrid td[data-rc]');
    if (td) { t.sel = { r: +td.parentElement.dataset.rr, c: +td.dataset.rc }; $$('#resGrid tr.rsel').forEach(x => x.classList.remove('rsel')); $$('#resGrid td.cur').forEach(x => x.classList.remove('cur')); td.parentElement.classList.add('rsel'); td.classList.add('cur'); renderDetail(); }
  }
});
function readFilters(t, keepDrafts) {
  t.filters = $$('#filters .frow').map(r => ({ col: $('[data-f=col]', r).value, op: $('[data-f=op]', r).value, val: $('[data-f=val]', r)?.value ?? '' })).filter(f => keepDrafts || f.val || /null/.test(f.op));
}
view.addEventListener('change', e => { const t = activeTab(); if (t?.kind === 'table' && e.target.matches('#filters select')) { readFilters(t, true); renderTableView(t); } });
view.addEventListener('keydown', e => { const t = activeTab(); if (t?.kind === 'table' && e.target.matches('#filters input') && e.key === 'Enter') { readFilters(t); renderTableView(t); renderDetail(); } });
view.addEventListener('input', e => {
  const t = activeTab(); if (!t) return;
  if (e.target.id === 'quick') { t.quick = e.target.value; t.sel.r = 0; renderGrid(t); renderDetail(); }
});
view.addEventListener('dblclick', e => {
  const t = activeTab(); if (t?.kind !== 'table') return;
  const td = e.target.closest('#gridWrap td[data-c]'); if (td && !td.classList.contains('editing')) { selectCell(t, +td.parentElement.dataset.r, +td.dataset.c, false); editCell(t); }
});
view.addEventListener('contextmenu', e => {
  const t = activeTab(); if (t?.kind !== 'table') return;
  const td = e.target.closest('#gridWrap td[data-c]'); if (!td) return; e.preventDefault();
  selectCell(t, +td.parentElement.dataset.r, +td.dataset.c, false);
  const row = t._rows[t.sel.r], c = SCHEMA[t.table].cols[t.sel.c], v = cellVal(t, row, t.sel.c), ro = !!SCHEMA[t.table].view;
  const vt = valueText(v);
  menu(e.clientX, e.clientY, [
    { i: 'copy', l: 'Copy value', k: '⌘C', fn: () => toast('Copied ' + (vt.length > 30 ? vt.slice(0, 30) + '…' : vt)) },
    { i: 'copy', l: 'Copy row as JSON', fn: () => toast('Copied row as JSON') },
    { i: 'sql', l: 'Copy row as INSERT', fn: () => toast('Copied INSERT statement') },
    '-',
    { i: 'filter', l: `Filter <b style="font-weight:500">${esc(c.n)}</b> = ${esc(vt.length > 18 ? vt.slice(0, 18) + '…' : vt)}`, fn: () => { t.filters = [{ col: c.n, op: v === null ? 'is null' : '=', val: v === null ? '' : vt }]; t.showFilters = true; t.sel.r = 0; renderTableView(t); renderDetail(); } },
    ...(c.fk && v != null ? [{ i: 'arrow', l: `Open ${c.fk} #${esc(v)}`, fn: () => openTable(c.fk, false, v) }] : []),
    ...(ro ? [] : ['-',
      { i: 'format', l: 'Edit cell', k: '↵', fn: () => editCell(t) },
      ...(c.nul ? [{ i: 'null', l: 'Set NULL', fn: () => { setValue(t, row, t.sel.c, null); renderGrid(t); renderTabs(); renderDetail(); } }] : []),
      { i: 'dup', l: 'Duplicate row', k: '⌘D', fn: () => { const k = 10000 + S.nextId++; const pkI = SCHEMA[t.table].cols.findIndex(c => c.pk); t.rows.unshift({ k, ins: true, v: row.v.map((x, i) => i === pkI ? DEFAULT : x) }); renderGrid(t); renderTabs(); selectCell(t, 0, t.sel.c); } },
      t.deleted.has(row.k) ? { i: 'refresh', l: 'Restore row', fn: () => { t.deleted.delete(row.k); renderGrid(t); renderTabs(); renderDetail(); } }
                           : { i: 'trash', l: 'Delete row', k: '⌘⌫', red: 1, fn: () => markDelete(t) }]),
  ]);
});
function markDelete(t) {
  if (SCHEMA[t.table].view) return;
  const row = t._rows[t.sel.r]; if (!row) return;
  if (row.ins) { t.rows = t.rows.filter(r => r !== row); [...t.changes.keys()].filter(k => k.startsWith(row.k + ':')).forEach(k => t.changes.delete(k)); }
  else t.deleted.has(row.k) ? t.deleted.delete(row.k) : t.deleted.add(row.k);
  renderGrid(t); renderTabs(); selectCell(t, t.sel.r, t.sel.c);
}

// column resize + splitter
view.addEventListener('mousedown', e => {
  const t = activeTab();
  const rz = e.target.closest('.rz');
  if (rz && t?.kind === 'table') {
    e.preventDefault(); const ci = +rz.dataset.rz, x0 = e.clientX, w0 = t.widths[ci];
    rz.classList.add('drag');
    const colEl = $$('#gridWrap col')[ci + 1], table = $('#gridWrap table');
    const mv = ev => { t.widths[ci] = Math.max(56, w0 + ev.clientX - x0); colEl.style.width = t.widths[ci] + 'px'; table.style.width = 46 + t.widths.reduce((a, b) => a + b, 0) + 'px'; };
    const up = () => { rz.classList.remove('drag'); removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up); return;
  }
  if (e.target.id === 'split' && t?.kind === 'sql') {
    e.preventDefault(); const ed = $('#editor'), y0 = e.clientY, h0 = ed.offsetHeight; e.target.classList.add('drag');
    const max = $('.sql').offsetHeight - 120;
    const mv = ev => { t.edh = Math.max(90, Math.min(max, h0 + ev.clientY - y0)); ed.style.setProperty('--edh', t.edh + 'px'); };
    const up = () => { $('#split')?.classList.remove('drag'); removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  }
});

// SQL editor
view.addEventListener('input', e => { if (e.target.id === 'ta') { onEditorInput(); acUpdate(); } });
view.addEventListener('keydown', e => {
  if (e.target.id !== 'ta') return;
  const t = activeTab(), ta = e.target, mod = e.metaKey || e.ctrlKey;
  if (AC.open) {
    if (e.key === 'ArrowDown') { AC.i = (AC.i + 1) % AC.items.length; acRender(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp') { AC.i = (AC.i - 1 + AC.items.length) % AC.items.length; acRender(); e.preventDefault(); return; }
    if ((e.key === 'Enter' && !mod) || e.key === 'Tab') { acAccept(); e.preventDefault(); return; }
    if (e.key === 'Escape') { acClose(); e.preventDefault(); e.stopPropagation(); return; }
  }
  if (mod && e.key === 'Enter') { e.preventDefault(); acClose(); doRun(t, e.shiftKey); return; }
  if (e.ctrlKey && e.key === ' ') { e.preventDefault(); acUpdate(true); return; }
  if (e.key === 'Tab') { e.preventDefault(); ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end'); onEditorInput(); return; }
  if (e.key === 'Enter') { const line = ta.value.slice(0, ta.selectionStart).split('\n').at(-1); const ind = /^\s*/.exec(line)[0]; e.preventDefault(); ta.setRangeText('\n' + ind, ta.selectionStart, ta.selectionEnd, 'end'); onEditorInput(); acClose(); return; }
  if (mod && e.key === '/') { e.preventDefault(); const s = ta.value.lastIndexOf('\n', ta.selectionStart - 1) + 1; const line = ta.value.slice(s).split('\n')[0]; if (line.startsWith('-- ')) ta.setRangeText('', s, s + 3, 'end'); else ta.setRangeText('-- ', s, s, 'end'); onEditorInput(); return; }
  if (['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) acClose();
  if (e.key === 'Escape') { acClose(); e.stopPropagation(); }
});
view.addEventListener('keyup', e => { if (e.target.id === 'ta') { updateLnCol(); const t = activeTab(); t._caret = e.target.selectionStart; } });
view.addEventListener('mouseup', e => { if (e.target.id === 'ta') { acClose(); setTimeout(updateLnCol); activeTab()._caret = e.target.selectionStart; } });
view.addEventListener('scroll', () => acClose(), true);

// detail panel
const dp = $('#detail');
dp.addEventListener('input', e => { if (e.target.id === 'dpq') applyDetailFilter(); });
dp.addEventListener('change', e => {
  const t = activeTab(); if (t?.kind !== 'table') return;
  const row = t._rows[t.sel.r], cols = SCHEMA[t.table].cols;
  const fv = e.target.dataset.fv ?? e.target.dataset.fe;
  if (fv != null) { const ci = +fv; setValue(t, row, ci, parseInput(e.target.value, cols[ci], cellVal(t, row, ci))); renderGrid(t); renderTabs(); renderDetail(); selectCell(t, t.sel.r, ci, true); }
});
dp.addEventListener('focusout', e => {
  const t = activeTab(); if (t?.kind !== 'table' || e.target.dataset.json == null) return;
  const row = t._rows[t.sel.r], ci = +e.target.dataset.json;
  try { const v = JSON.parse(e.target.innerText); if (JSON.stringify(v) !== JSON.stringify(cellVal(t, row, ci))) { setValue(t, row, ci, v); renderGrid(t); renderTabs(); renderDetail(); } }
  catch { toast('Invalid JSON — change not applied', 'warn'); renderDetail(); }
});
dp.addEventListener('click', e => {
  const t = activeTab(); if (!t) return;
  const a = e.target.closest('[data-act]')?.dataset.act;
  if (a === 'rowprev' || a === 'rownext') {
    const d = a === 'rowprev' ? -1 : 1;
    if (t.kind === 'table') selectCell(t, t.sel.r + d, t.sel.c);
    else if (t.result?.rows) { t.sel.r = Math.max(0, Math.min(t.result.rows.length - 1, t.sel.r + d)); renderResults(t); renderDetail(); }
    return;
  }
  if (a === 'rowjson') { toast('Row copied as JSON', 'copy'); return; }
  if (a === 'rowmenu') { const r = e.target.closest('[data-act]').getBoundingClientRect(); menu(r.right - 220, r.bottom + 4, [{ i: 'copy', l: 'Copy as JSON' }, { i: 'sql', l: 'Copy as INSERT' }, { i: 'dup', l: 'Duplicate row' }, '-', { i: 'trash', l: 'Delete row', red: 1, fn: () => t.kind === 'table' && markDelete(t) }]); return; }
  const fk = e.target.closest('.fklink'); if (fk) { openTable(fk.dataset.fk, false, fk.dataset.v); return; }
  const ref = e.target.closest('.ref[data-open]'); if (ref) { openTable(ref.dataset.open, false); return; }
  const tog = e.target.closest('[data-tog]');
  if (tog && t.kind === 'table' && !SCHEMA[t.table].view) { const row = t._rows[t.sel.r], ci = +tog.dataset.tog; setValue(t, row, ci, !cellVal(t, row, ci)); renderGrid(t); renderTabs(); renderDetail(); selectCell(t, t.sel.r, ci, true); return; }
  const sn = e.target.closest('[data-setnull]'); if (sn && t.kind === 'table') { const row = t._rows[t.sel.r]; setValue(t, row, +sn.dataset.setnull, null); renderGrid(t); renderTabs(); renderDetail(); return; }
  const cp = e.target.closest('[data-copyv]'); if (cp) { toast('Copied value', 'copy'); return; }
});

// global keys
addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, t = activeTab();
  const typing = e.target.matches('input, textarea, select, [contenteditable]');
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (mod && e.key.toLowerCase() === 'p') { e.preventDefault(); openPalette(); return; }
  if (mod && e.key.toLowerCase() === 't') { e.preventDefault(); newSql(); return; }
  if (mod && e.key.toLowerCase() === 'w') { e.preventDefault(); if (t) closeTab(t.id); return; }
  if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); S.sidebar = !S.sidebar; renderChrome(); return; }
  if (mod && e.key === '.') { e.preventDefault(); S.detail = !S.detail; renderChrome(); return; }
  if (mod && e.key.toLowerCase() === 'f' && !(t?.kind === 'sql' && typing)) { e.preventDefault(); if (!S.sidebar) { S.sidebar = true; renderChrome(); } $('#sbq').focus(); $('#sbq').select(); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); if (t?.kind === 'table' && pendingCount(t)) S.conn.env === 'production' ? reviewModal(t, true) : commit(t); else if (t?.kind === 'sql') { t.dirty = false; renderTabs(); toast(`Saved “${t.title}”`, 'save'); } return; }
  if (mod && /^[1-9]$/.test(e.key)) { const x = S.tabs[+e.key - 1]; if (x) { e.preventDefault(); S.active = x.id; render(); } return; }
  if (e.key === 'Escape') { if ($('.menu, .scrim')) { closeOverlays(); return; } }
  if (typing || $('.scrim')) return;
  if (t?.kind === 'table' && t.mode === 'data') {
    const { r, c } = t.sel;
    const page = Math.floor(($('#gridWrap')?.clientHeight || 400) / 27) - 2;
    const moves = { ArrowDown: [1, 0], ArrowUp: [-1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1], PageDown: [page, 0], PageUp: [-page, 0] };
    if (moves[e.key]) { e.preventDefault(); const [dr, dc] = moves[e.key]; mod ? selectCell(t, dr ? (dr > 0 ? 1e9 : 0) : r, dc ? (dc > 0 ? 1e9 : 0) : c) : selectCell(t, r + dr, c + dc); return; }
    if (e.key === 'Tab') { e.preventDefault(); selectCell(t, r, c + (e.shiftKey ? -1 : 1)); return; }
    if (e.key === 'Enter' || e.key === 'F2') { e.preventDefault(); editCell(t); return; }
    if (mod && (e.key === 'Backspace' || e.key === 'Delete')) { e.preventDefault(); markDelete(t); return; }
    if (mod && e.key.toLowerCase() === 'c') { const v = valueText(cellVal(t, t._rows[r], c)); navigator.clipboard?.writeText(v); toast('Copied ' + (v.length > 32 ? v.slice(0, 32) + '…' : v), 'copy'); return; }
    if (e.key === 'Backspace' && !mod) { e.preventDefault(); editCell(t, ''); return; }
    if (e.key.length === 1 && !mod && !e.altKey) { e.preventDefault(); editCell(t, e.key); return; }
  }
});
addEventListener('mousedown', e => { if (!e.target.closest('.menu') && $('.menu')) $('.menu').remove(); if (AC.open && !e.target.closest('.ac') && e.target.id !== 'ta') acClose(); });
addEventListener('resize', () => acClose());

/* ════════════════════════════════════════════════════════════
   boot: a realistic mid-session state

measureChar();
{
  const users = tableTab('users');

  S.tabs = [users, rev, orders];
  S.active = users.id;
}
render();
