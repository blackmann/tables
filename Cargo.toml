[package]
name = "tables"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native GPUI database client: tables, SQL tabs, row detail"

[dependencies]
gpui = "=0.2.2"
gpui-component = { version = "=0.5.0", features = ["tree-sitter-languages"] }
gpui-component-assets = "=0.5.0"
lsp-types = "0.97"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"
chrono = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
security-framework = "3"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }

[profile.dev]
debug = 0
# Light optimization keeps scrolling and row navigation smooth in dev builds.
opt-level = 1

# GPUI and its renderer are far smoother optimized; app code stays quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
